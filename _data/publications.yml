- title: "UGC 2369S: A Kiloparsec-scale Triple Merger Candidate Identified in a Nearby Luminous Infrared Galaxy"
  authors: "<b>Y. Ding</b>, M. J. Koss, F. A. Harrison, C. C. Steidel, C. Auge, J. Gillette, E. Hammerstein, R. Li, M. Magno, I. del Moral-Castro, A. Peca, C. Ricci, Y. Song, E. Treister, Z. Zhuang"
  journal: "ApJ"
  ref: "1002, 130"
  year: 2026
  doi: "10.3847/1538-4357/ae5643"
  first_author: true
  image: "/images/research/ugc2369s_multiwavelength.jpg"
  summary: "One of the clearest triple-nucleus mergers at ~3 kpc separations, and the first studied at high resolution across X-ray, optical/NIR adaptive-optics IFU and radio wavelengths. The northern core probably hosts the most massive black hole (~10<sup>8</sup> M<sub>&#9737;</sub>) and fits a heavily obscured AGN (N<sub>H</sub> &#8819; 10<sup>25</sup> cm<sup>-2</sup>), but the identification is still inconclusive. The other two cores show tidal disruption instead, and the stellar bulge of the southwestern core seems to have been stripped by the three-body potential."

- title: "Next-generation Accretion Disk Reflection Model: High-density Plasma Effects"
  authors: "<b>Y. Ding</b>, J. A. García, T. R. Kallman, C. Mendoza, M. Bautista, F. A. Harrison, J. A. Tomsick, J. Dong"
  journal: "ApJ"
  ref: "974, 280"
  year: 2024
  doi: "10.3847/1538-4357/ad76a1"
  first_author: true
  image: "/images/research/xillver_highdensity.jpg"
  summary: "Adds high-density plasma corrections to the XSTAR atomic rates used by the XILLVER reflection model. The modified recombination rates account for most of the difference between model versions. Dense disks can produce strong Fe K and O resonance features even when highly ionized, which may explain the supersolar iron abundances found in some sources."

- title: "Accretion Disk Outflow during the X-Ray Flare of the Super-Eddington Active Nucleus of I Zwicky 1"
  authors: "<b>Y. Ding</b>, R. Li, L. C. Ho, C. Ricci"
  journal: "ApJ"
  ref: "931, 77"
  year: 2022
  doi: "10.3847/1538-4357/ac6955"
  first_author: true
  image: "/images/research/izw1_outflows.jpg"
  summary: "Joint XMM-Newton + NuSTAR observations follow an X-ray flare in a super-Eddington NLS1. The corona cooled from ~200 to ~15 keV during the flare. Several variable ionized winds and ultrafast outflows follow &xi; &prop; v<sup>3.24</sup>, as expected for a super-Eddington wind, and their feedback can account for the undermassive black hole in I Zw 1."

- title: "Timing and spectral variability of the high-mass X-ray pulsar GX 301&minus;2 over orbital phases observed by Insight-HXMT"
  authors: "<b>Y. Z. Ding</b>, W. Wang, P. R. Epili, Q. Liu, M. Y. Ge, F. J. Lu, J. L. Qu, L. M. Song, S. Zhang, S. N. Zhang"
  journal: "MNRAS"
  ref: "506, 2712"
  year: 2021
  doi: "10.1093/mnras/stab1862"
  first_author: true
  image: "/images/research/gx301_crsf.jpg"
  summary: "Finds two cyclotron lines (30&ndash;42 and 48&ndash;56 keV) that track luminosity: a positive correlation below ~10<sup>37</sup> erg s<sup>-1</sup> and a negative one above it. This implies a surface magnetic field of ~(0.5&ndash;2)&times;10<sup>13</sup> G."

- title: "QPOs and orbital elements of X-ray binary 4U 0115+63 during the 2017 outburst observed by Insight-HXMT"
  authors: "<b>Y. Z. Ding</b>, W. Wang, P. Zhang, Q. C. Bu, et al."
  journal: "MNRAS"
  ref: "503, 6045"
  year: 2021
  doi: "10.1093/mnras/stab835"
  first_author: true
  image: "/images/research/4u0115_wavelet.jpg"
  summary: "Brings wavelet analysis to Insight-HXMT timing data, finding a ~10 mHz QPO plus multiple QPOs at ~16&ndash;32 s and ~67&ndash;200 s. It also updates the orbital elements, including the periastron precession rate."

